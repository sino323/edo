name: Release Jarvis APK

# Push a tag like v1.2 and the APK is attached to a GitHub Release you can open on your phone.
#   git tag v1.2 && git push origin v1.2
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle :app:assembleRelease --stacktrace -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Jarvis-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
